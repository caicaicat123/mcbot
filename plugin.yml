name: McBot
version: 1.2.0
main: mcbot.McBot
api-version: '1.21'
description: 一个住在服务器里的捣蛋鬼 AI，偶尔帮忙，时常搞怪。
author: 新世界网络
commands:
  mcbot:
    description: 和服务器里的 AI 交互，或管理它的行为。
    usage: /mcbot <ask|poke|reload|toggle> [内容]
permissions:
  mcbot.admin:
    description: 重载配置、强制触发、暂停搞怪。
    default: op
  mcbot.talk:
    description: 允许向 AI 提问。
    default: true
